# Optional overlay — only for app/examples/kafka_ingestion (see its README).
# Not part of the default `docker compose up`; run with:
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d redpanda
#
# Redpanda: a single Kafka-API-compatible binary, no ZooKeeper — the
# lightest way to demo a Kafka producer/consumer locally.

services:
  redpanda:
    image: redpandadata/redpanda:v24.1.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://localhost:19092
    ports:
      - "19092:19092"
