name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lore
          POSTGRES_PASSWORD: lore
          POSTGRES_DB: lore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lore:lore@localhost:5432/lore
      # Embedded Qdrant — the agent, judge and summarizer are all driven by
      # scripted fakes in the suite, so no vector server and no API keys are
      # needed. Absence of GROQ_API_KEY also keeps the eval harness in the
      # deterministic MOCK path, which is what makes it a usable gate.
      VECTOR_STORE: qdrant
      LORE_ADMIN_SECRET: ci-admin-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

      # The gate from ADR-0001. Runs the golden set through the active path
      # and fails the build below the configured floors — a retrieval or
      # reranking regression should not merge quietly.
      - name: Eval gate
        run: python -m app.eval.harness
